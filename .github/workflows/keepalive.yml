# Supabase 를 깨워 둔다.
#
# 무료 플랜은 7일 동안 아무도 안 두드리면 프로젝트를 멈춘다. 방문자가 왔을 때
# 죽어 있으면 서비스가 없는 것과 같아서, 매일 한 번 가벼운 조회를 보낸다.
#
# Vercel 의 crons 를 쓰지 않는 이유: 크론 설정은 vercel.json 에 있어 배포가
# 필요한데, 지금 함수가 14개라 무료 플랜 상한(12개)에 걸려 배포가 거부된다.
# 여기서 부르면 배포와 무관하게 돈다.

name: keepalive

on:
  schedule:
    - cron: "0 18 * * *"   # UTC 18:00 = KST 03:00
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: DB 를 한 번 두드린다
        run: |
          # 파라미터를 주지 않으면 400 을 돌려주는데, 그 전에 Supabase 에
          # 접속하므로 깨우는 데는 충분하다. LLM 은 부르지 않아 값이 안 든다.
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 60 \
            https://vizuden.com/api/prescription-full)
          echo "HTTP $code"; cat /tmp/out.json; echo
          # Supabase 가 멈춰 있으면 5xx 가 온다. 그때만 실패로 본다 —
          # 조용히 넘기면 멈춘 것도 모르게 된다.
          case "$code" in 5*|000) echo "DB 가 응답하지 않는다"; exit 1;; esac
